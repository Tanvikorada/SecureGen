<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SecureGen</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0A0E1A;
      color: #fff;
      width: 320px;
      margin: 0;
      padding: 20px;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon {
      color: #3B82F6;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #9CA3AF;
    }
    select, input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 6px;
      background-color: #111827;
      border: 1px solid #374151;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #3B82F6;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #3B82F6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563EB;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      color: #10B981;
      display: none;
    }
    .link {
      color: #3B82F6;
      text-decoration: none;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    SecureGen Settings
  </h2>
  
  <label for="provider">AI Provider</label>
  <select id="provider">
    <option value="groq">Groq (Llama 3)</option>
    <option value="gemini">Google Gemini</option>
  </select>

  <div id="groqSection">
    <label for="groqApiKey">Groq API Key</label>
    <input type="password" id="groqApiKey" placeholder="gsk_...">
    <p style="font-size: 12px; color: #6B7280; margin-top: -8px; margin-bottom: 16px;">
      Get a free key at <a href="https://console.groq.com/keys" target="_blank" class="link">console.groq.com</a>
    </p>
  </div>

  <div id="geminiSection" style="display: none;">
    <label for="geminiApiKey">Gemini API Key</label>
    <input type="password" id="geminiApiKey" placeholder="AIzaSy...">
    <p style="font-size: 12px; color: #6B7280; margin-top: -8px; margin-bottom: 16px;">
      Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link">aistudio.google.com</a>
    </p>
  </div>
  
  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status">Settings saved successfully!</div>

  <script src="popup.js"></script>
</body>
</html>
